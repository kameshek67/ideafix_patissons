[project]
name = "olymp-api"
version = "0.0.0"
description = "FastAPI: модульный монолит Олимпа"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "uvicorn>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "redis>=5.2",
  "prometheus-client>=0.21",
  "olymp-domain",
  "olymp-db",
  "olymp-llm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olymp_api"]

