[project]
name = "olymp-workers"
version = "0.0.0"
description = "Конвейер данных: сборка базы из XLSX, обход сайтов вузов, проверка качества"
requires-python = ">=3.13"
dependencies = [
  "olymp-domain",
  "olymp-db",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "psycopg[binary]>=3.2",
  "dramatiq[rabbitmq]>=1.17",
  "structlog>=24.4",
]

[project.scripts]
olymp-ingest = "olymp_workers.ingest:main"
olymp-extra-points = "olymp_workers.extra_points:main"
olymp-refresh-sources = "olymp_workers.refresh_sources:main"
olymp-validate = "olymp_workers.validate:main"
olymp-max-bot = "olymp_workers.max_bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olymp_workers"]
