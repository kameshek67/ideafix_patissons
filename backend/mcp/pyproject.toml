[project]
name = "olymp-mcp"
version = "0.0.0"
description = "MCP-сервер поверх публичного API Олимпа для внешних ассистентов"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.27",
  "mcp>=1.10,<2",
]

[project.scripts]
olymp-mcp = "olymp_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olymp_mcp"]
