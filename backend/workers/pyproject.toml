[project]
name = "olymp-workers"
version = "0.0.0"
description = "Конвейер данных: сборка базы из XLSX, обход сайтов вузов, проверка качества"
requires-python = ">=3.13"
dependencies = [
  "olymp-domain",
  "olymp-db",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "psycopg[binary]>=3.2",
  "dramatiq[rabbitmq]>=1.17",
  "structlog>=24.4",
  "olymp-llm",
  "pdfplumber>=0.11",
  "httpx>=0.27",
]

[project.scripts]
olymp-ingest = "olymp_workers.ingest:main"
olymp-extra-points = "olymp_workers.extra_points:main"
olymp-refresh-sources = "olymp_workers.refresh_sources:main"
olymp-materials = "olymp_workers.materials:main"
olymp-rsosh = "olymp_workers.rsosh:main"
olymp-validate = "olymp_workers.validate:main"
olymp-snapshot = "olymp_workers.snapshot:main"
olymp-max-bot = "olymp_workers.max_bot:main"
olymp-report-regressions = "olymp_workers.report_regressions:main"
olymp-ai-cards = "olymp_workers.ai_cards:main"
olymp-ai-verify = "olymp_workers.ai.verify:main"
olymp-eval-extract = "olymp_workers.eval_extract:main"
olymp-extract = "olymp_workers.extract.cli:main"
olymp-export-reports = "olymp_workers.export_reports:main"
olymp-sources = "olymp_workers.sources.cli:main"
olymp-export-dataset = "olymp_workers.export_dataset:main"
olymp-passages = "olymp_workers.passages:main"
olymp-analysis = "olymp_workers.analysis:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olymp_workers"]

