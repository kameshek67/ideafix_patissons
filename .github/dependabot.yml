# Обновления зависимостей раз в неделю, небольшими PR в dev; мажорные версии не предлагаем — их обновляют руками
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: main
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
