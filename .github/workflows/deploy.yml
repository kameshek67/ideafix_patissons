# Выкатка main на https://ideafix.patissons.tech (сервер 2.26.52.44). Как устроено и как
# откатиться — infra/deploy/README.md. Секрет один: DEPLOY_SSH_KEY (ключ пользователя deploy).
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

# выкатки идут по одной, начатая не прерывается
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  COMPOSE_PROJECT_NAME: ideafix
  DEPLOY_HOST: 2.26.52.44
  # ключ сервера (не секрет): защищает от подмены хоста
  DEPLOY_KNOWN_HOST: 2.26.52.44 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEOp/jKkipQ6ZNvA7SQVXo5tcn8lD2v5nLGsUha5acZm

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://ideafix.patissons.tech
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: образы в GHCR
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          services=$(python3 infra/deploy/images.py "$registry" "$GITHUB_SHA" .deploy)
          for f in compose.yaml compose.yml docker-compose.yaml docker-compose.yml; do [ -f "$f" ] && break; done
          docker compose -f "$f" -f .deploy/build-cache.json -f .deploy/images.json \
            build --push $services

      - name: релиз на сервер
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "::error::нет секрета DEPLOY_SSH_KEY (infra/deploy/README.md)"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOST" > ~/.ssh/known_hosts
          ssh_deploy() { ssh -i ~/.ssh/deploy -o BatchMode=yes -o ServerAliveInterval=15 "deploy@$DEPLOY_HOST" "$@"; }

          # код релиза (compose, data/ и т. п.) + оверрайд с образами; .env живёт только на сервере
          git archive --format=tar -o release.tar HEAD
          tar -rf release.tar .deploy/images.json .deploy/services
          gzip -c release.tar | ssh_deploy upload "$GITHUB_SHA"

          # токен нужен серверу только чтобы скачать образы; после выкатки он недействителен
          printf '%s\n%s\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" | ssh_deploy deploy "$GITHUB_SHA"

      - name: сайт отвечает снаружи
        run: |
          for i in $(seq 1 20); do
            curl -fsS -o /dev/null -m 10 https://ideafix.patissons.tech/ && exit 0
            sleep 6
          done
          echo "::warning::https://ideafix.patissons.tech не отвечает снаружи (DNS или сертификат?), на сервере релиз поднялся"
