name: ci
on:
  pull_request:
  push:
    branches: [main, dev]

# новый push в ту же ветку отменяет устаревший прогон
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# токен CI только читает репозиторий; кому нужно больше — просит в своей задаче
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_USER: olymp, POSTGRES_PASSWORD: olymp, POSTGRES_DB: olymp}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U olymp" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      OLYMP_TEST_DATABASE_URL: postgresql+psycopg://olymp:olymp@localhost:5432/olymp
      # без базы тесты не пропускаются, а падают
      OLYMP_REQUIRE_DB: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages apps
      - run: uv run lint-imports
      - name: миграции — одна голова, модели совпадают со схемой
        working-directory: packages/db
        env: {OLYMP_DATABASE_URL: postgresql+psycopg://olymp:olymp@localhost:5432/olymp}
        run: |
          heads=$(uv run alembic heads | wc -l)
          [ "$heads" -eq 1 ] || { echo "::error::голов Alembic: $heads — перенумеруйте миграцию"; exit 1; }
          uv run alembic upgrade head
          uv run alembic check
      # в тестах база собирается из настоящего XLSX и сверяется с итогами прототипа
      - run: uv run pytest -q
      - name: контракт API актуален
        run: |
          uv run python -m olymp_api.openapi_cli > docs/openapi.json
          git diff --exit-code docs/openapi.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run gen:api --workspace olymp-web
      - name: клиент API актуален
        run: git diff --exit-code packages/api-client/schema.d.ts
      - run: npm run lint --workspace olymp-web
      - run: npm test --workspace olymp-web
      - run: npm run build --workspace olymp-web

  # образы собираются и API отвечает — иначе это выяснилось бы только при выкатке main
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -q -f infra/Dockerfile.api -t olymp-api .
      - run: docker build -q -f infra/Dockerfile.web -t olymp-web .
      - name: API отвечает на /healthz
        run: |
          docker run -d --name api -p 8000:8000 olymp-api
          for _ in $(seq 1 30); do curl -fs http://127.0.0.1:8000/healthz && exit 0; sleep 1; done
          docker logs api; exit 1

  # файлы задач docs/tasks/T-*.md: шапки, статусы, зависимости (ADR 0009)
  tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python scripts/tasks.py check

  secrets:
    runs-on: ubuntu-latest
    # gitleaks на PR читает список коммитов PR: без pull-requests: read — 403
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
