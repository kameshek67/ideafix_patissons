[project]
name = "olymp-llm"
version = "0.0.0"
description = "Шлюз к языковым моделям (ADR 0010): OpenAI-совместимый клиент для API и воркеров"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.27",
  "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olymp_llm"]
