# Для разработки: добавляет к docker-compose.yml порты на localhost, чтобы API, воркеры и тесты
# с хоста видели базу. Подключается в `just up`; в выкатку и в полный стек не входит.
services:
  postgres:
    ports: ["127.0.0.1:5432:5432"]
  redis:
    ports: ["127.0.0.1:6379:6379"]
  rabbitmq:
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
